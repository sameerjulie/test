<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pictures</title>
  <style>
    :root {
      --bg: #fbfaf7;
      --text: #1f2933;
      --muted: #5b6770;
      --link: #1d5c8a;
      --rule: #d9d6cf;
      --tile: #e9e6df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191c;
        --text: #e8e6e1;
        --muted: #9aa3aa;
        --link: #7fb8e3;
        --rule: #343a3f;
        --tile: #23282c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }
    main {
      max-width: 60rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 1.5rem; }
    a { color: var(--link); }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
    .back { display: inline-block; margin-bottom: 2rem; }
    #status { color: var(--muted); margin: 0 0 1.25rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .grid a {
      display: block;
      aspect-ratio: 1 / 1;
      background: var(--tile);
      overflow: hidden;
    }
    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @media (max-width: 480px) {
      main { padding: 2rem 1rem 3rem; }
      .grid { gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">Back to home</a>
    <h1>Pictures</h1>
    <p id="status">Loading pictures…</p>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    // The page works out your GitHub username and repository name from its own
    // web address (username.github.io/repository/). If you use a custom domain,
    // fill in these two values yourself, for example OWNER = "sameer".
    var OWNER = "";
    var REPO = "";
    var FOLDER = "pictures";

    var IMAGE_TYPES = /\.(jpe?g|png|gif|webp|avif|svg)$/i;

    function detectRepo() {
      if (OWNER && REPO) return;
      var host = location.hostname;
      if (host.endsWith(".github.io")) {
        OWNER = host.split(".")[0];
        var first = location.pathname.split("/").filter(Boolean)[0];
        // Project sites live at username.github.io/repository/.
        // The user site (username.github.io) uses a repo named after the host.
        REPO = first && first.indexOf(".") === -1 ? first : host;
      }
    }

    function show(message) {
      document.getElementById("status").textContent = message;
    }

    async function loadPictures() {
      detectRepo();
      if (!OWNER || !REPO) {
        show("Set OWNER and REPO near the bottom of pictures.html so the page can find your photos.");
        return;
      }

      var url = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + FOLDER;
      try {
        var response = await fetch(url);
        if (response.status === 404) {
          show("Couldn't find a folder named \"" + FOLDER + "\" in " + OWNER + "/" + REPO + ".");
          return;
        }
        if (response.status === 403) {
          show("GitHub is limiting requests right now. Try again in a few minutes.");
          return;
        }
        if (!response.ok) throw new Error("HTTP " + response.status);

        var files = await response.json();
        var photos = files
          .filter(function (f) { return f.type === "file" && IMAGE_TYPES.test(f.name); })
          .sort(function (a, b) {
            return a.name.localeCompare(b.name, undefined, { numeric: true });
          });

        if (photos.length === 0) {
          show("No pictures in the \"" + FOLDER + "\" folder yet.");
          return;
        }

        var grid = document.getElementById("grid");
        photos.forEach(function (photo) {
          var src = FOLDER + "/" + encodeURIComponent(photo.name);
          var link = document.createElement("a");
          link.href = src;
          link.target = "_blank";
          link.rel = "noopener";

          var img = document.createElement("img");
          img.src = src;
          img.alt = photo.name.replace(/\.[^.]+$/, "");
          img.loading = "lazy";

          link.appendChild(img);
          grid.appendChild(link);
        });
        show(photos.length + (photos.length === 1 ? " picture" : " pictures") + ". Select one to see it full size.");
      } catch (error) {
        show("Couldn't load the pictures. Check your connection and try again.");
      }
    }

    loadPictures();
  </script>
</body>
</html>
